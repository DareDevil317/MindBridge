<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — MindBridge</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>

<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="brand-mark">
                <div class="logo-icon"><img src="images/logo.png" alt="MindBridge logo" style="width:100%;height:100%;object-fit:contain;"></div>
                <span>MindBridge</span>
            </div>
            <div class="card">
                <h2>Create your account</h2>
                <p>Small steps today. Better tomorrow.</p>

                <div id="formAlert" class="alert alert-error hidden"></div>

                <form id="signupForm" novalidate>
                    <div class="field">
                        <label for="full_name">Full name</label>
                        <input type="text" id="full_name" autocomplete="name" required>
                        <div class="error"></div>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" autocomplete="email" required>
                        <div class="error"></div>
                    </div>
                    <div class="grid grid-2">
                        <div class="field">
                            <label for="password">Password</label>
                            <input type="password" id="password" autocomplete="new-password" required>
                            <div class="error"></div>
                        </div>
                        <div class="field">
                            <label for="confirm_password">Confirm password</label>
                            <input type="password" id="confirm_password" autocomplete="new-password" required>
                            <div class="error"></div>
                        </div>
                    </div>
                    <div class="grid grid-2">
                        <div class="field">
                            <label for="age">Age</label>
                            <input type="number" id="age" min="13" max="100" required>
                            <div class="error"></div>
                        </div>
                        <div class="field">
                            <label for="role">I am a</label>
                            <select id="role">
              <option value="student">Student</option>
              <option value="professional">Working professional</option>
            </select>
                        </div>
                    </div>

                    <label class="checkbox-row" style="margin-bottom:20px;">
          <input type="checkbox" id="agree">
          <span>I have read and agree to the <a href="terms.html" target="_blank">Terms &amp; Conditions and Privacy Policy</a>.</span>
        </label>

                    <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
                </form>

                <p class="text-center" style="margin-top:18px;">
                    Already have an account? <a href="login.html">Log in</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (localStorage.getItem("mb_terms_accepted") !== "true") {
            window.location.href = "terms.html";
        }
    </script>
</body>

</html>
