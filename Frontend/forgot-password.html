<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — MindBridge</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <script src="js/theme.js"></script>
</head>

<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="brand-mark">
                <div class="logo-icon"><img src="images/logo.png" alt="MindBridge logo" style="width:100%;height:100%;object-fit:contain;"></div>
                <span>MindBridge</span>
            </div>
            <div class="card">
                <h2>Reset your password</h2>
                <p>Enter your account email. We'll generate a reset link.</p>

                <div id="formAlert" class="alert alert-error hidden"></div>
                <div id="demoNote" class="alert alert-warning hidden"></div>

                <form id="forgotForm" novalidate>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" autocomplete="email" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg">Send Reset Link</button>
                </form>

                <p class="text-center" style="margin-top:18px;">
                    <a href="login.html">Back to log in</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById("forgotForm").addEventListener("submit", async(e) => {
            e.preventDefault();
            const alertBox = document.getElementById("formAlert");
            const demoNote = document.getElementById("demoNote");
            alertBox.classList.add("hidden");
            demoNote.classList.add("hidden");

            const email = document.getElementById("email").value.trim();
            const submitBtn = e.target.querySelector("button[type=submit]");
            submitBtn.disabled = true;
            submitBtn.textContent = "Sending...";

            try {
                const data = await apiRequest("/auth/forgot-password", {
                    method: "POST",
                    auth: false,
                    body: {
                        email
                    }
                });

                if (data.demo_reset_token) {
                    // This prototype has no email service configured, so the reset link
                    // is shown directly here for local testing.
                    demoNote.innerHTML = `${data.demo_note || ""}<br><a href="reset-password.html?token=${data.demo_reset_token}">Click here to reset your password (demo link)</a>`;
                    demoNote.classList.remove("hidden");
                } else {
                    alertBox.className = "alert alert-success";
                    alertBox.textContent = data.message;
                    alertBox.classList.remove("hidden");
                }
            } catch (err) {
                alertBox.textContent = err.message;
                alertBox.classList.remove("hidden");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Send Reset Link";
            }
        });
    </script>
</body>

</html>
