<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — MindBridge</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <script src="js/theme.js"></script>
</head>

<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="brand-mark">
                <div class="logo-icon"><img src="images/logo.png" alt="MindBridge logo" style="width:100%;height:100%;object-fit:contain;"></div>
                <span>MindBridge</span>
            </div>
            <div class="card">
                <h2>Set a new password</h2>

                <div id="formAlert" class="alert alert-error hidden"></div>

                <form id="resetForm" novalidate>
                    <div class="field">
                        <label for="new_password">New password</label>
                        <input type="password" id="new_password" autocomplete="new-password" required>
                    </div>
                    <div class="field">
                        <label for="confirm_password">Confirm new password</label>
                        <input type="password" id="confirm_password" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg">Reset Password</button>
                </form>

                <p class="text-center" style="margin-top:18px;">
                    <a href="login.html">Back to log in</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get("token");

        document.getElementById("resetForm").addEventListener("submit", async(e) => {
            e.preventDefault();
            const alertBox = document.getElementById("formAlert");
            alertBox.classList.add("hidden");

            const newPassword = document.getElementById("new_password").value;
            const confirm = document.getElementById("confirm_password").value;

            if (!token) {
                alertBox.textContent = "Missing or invalid reset link. Please request a new one.";
                alertBox.classList.remove("hidden");
                return;
            }
            if (newPassword !== confirm) {
                alertBox.textContent = "Passwords do not match.";
                alertBox.classList.remove("hidden");
                return;
            }

            const submitBtn = e.target.querySelector("button[type=submit]");
            submitBtn.disabled = true;
            submitBtn.textContent = "Resetting...";

            try {
                const data = await apiRequest("/auth/reset-password", {
                    method: "POST",
                    auth: false,
                    body: {
                        token,
                        new_password: newPassword
                    },
                });
                alertBox.className = "alert alert-success";
                alertBox.textContent = data.message;
                alertBox.classList.remove("hidden");
                setTimeout(() => (window.location.href = "login.html"), 1500);
            } catch (err) {
                alertBox.textContent = err.message;
                alertBox.classList.remove("hidden");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Reset Password";
            }
        });
    </script>
</body>

</html>
