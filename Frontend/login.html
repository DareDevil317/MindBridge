<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — MindBridge</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>

<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="brand-mark">
                <div class="logo-icon"><img src="images/logo.png" alt="MindBridge logo" style="width:100%;height:100%;object-fit:contain;"></div>
                <span>MindBridge</span>
            </div>
            <div class="card">
                <h2>Welcome back</h2>
                <p>Log in to continue your wellness journey.</p>

                <div id="formAlert" class="alert alert-error hidden"></div>

                <form id="loginForm" novalidate>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" autocomplete="email" required>
                        <div class="error"></div>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" autocomplete="current-password" required>
                        <div class="error"></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; font-size:0.88rem;">
                        <label class="checkbox-row" style="margin:0;">
            <input type="checkbox" id="remember"> <span>Remember me</span>
          </label>
                        <a href="forgot-password.html">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg">Log In</button>
                </form>

                <hr class="divider">
                <button class="btn btn-secondary btn-block" disabled title="OAuth not implemented in this prototype">
        Continue with Google (coming soon)
      </button>
                <button class="btn btn-secondary btn-block" style="margin-top:10px;" disabled title="OAuth not implemented in this prototype">
        Continue with GitHub (coming soon)
      </button>

                <p class="text-center" style="margin-top:18px;">
                    Don't have an account? <a href="signup.html">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (localStorage.getItem("mb_terms_accepted") !== "true") {
            window.location.href = "terms.html";
        }
        if (localStorage.getItem("mb_token")) {
            window.location.href = "dashboard.html";
        }
    </script>
</body>

</html>
